# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.2
group=com.denizen.schworlium
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Schworlium
mod_author=swankydenizen
mod_id=schworlium
license=GPL-V3
credits=Algorithm ported from WorleyCaves by SuperFluke
description=Worley-noise caves for Fabric and NeoForge
minecraft_version_range=[1.21.11]
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.11
parchment_version=2025.12.20

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.141.4+1.21.11
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.11.42
neoforge_loader_version_range=[4,)

# Lithostitched (provides the wrap_noise_router worldgen modifier we use to disable vanilla noise caves)
lithostitched_fabric_version=1.7.2-fabric-21.11
lithostitched_neoforge_version=1.7.2-neoforge-21.11
# Lithostitched (provides the FastNoiseLite (FNL) API the Worley carver uses; its wrap_noise_router
# modifier is NOT used — through at least 1.7.12 it ignores its "dimension" field and applies to
# every dimension, so the overworld final_density swap lives in our own ChunkMapMixin instead)
lithostitched_fabric_version=1.7.12-fabric-26.2
lithostitched_neoforge_version=1.7.12-neoforge-26.2

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
